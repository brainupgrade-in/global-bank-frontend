name: build

on:
  push:
    branches: [main, k8s]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # tsc -b runs as part of build, so a type error fails the job.
      - run: npm run build
